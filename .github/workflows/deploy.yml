name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - windows-ui-emulation
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  chat-proxy:
    # Deploys the Ask-my-portfolio Cloudflare Worker (Workers AI model) when the
    # repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured.
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.wrangler.outputs.deployment-url }}
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        if: env.HAS_CF == 'true'
        uses: actions/checkout@v4

      - name: Build chat knowledge base
        # Regenerates chat-proxy/knowledge.md from portfolioData.json so the
        # deployed worker always matches the site's data (Node is preinstalled).
        if: env.HAS_CF == 'true'
        run: node scripts/build-knowledge.mjs

      - name: Deploy worker
        id: wrangler
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: chat-proxy
          command: deploy

  deploy:
    needs: chat-proxy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Set these under Settings > Secrets and variables > Actions > Variables.
          # Both are optional: without them the chat shows an offline notice and
          # Contact shows an email button instead of the form.
          VITE_CHAT_ENDPOINT: ${{ vars.VITE_CHAT_ENDPOINT || needs.chat-proxy.outputs.url }}
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
