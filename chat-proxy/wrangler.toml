name = "portfolio-chat-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

# knowledge.md is imported by worker.js as a plain string
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Workers AI (free daily allowance) is the default model provider.
[ai]
binding = "AI"

[vars]
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Comma-separated list of origins allowed to call the worker
ALLOWED_ORIGIN = "https://sanketc001.github.io,http://localhost:5173"

# Optional Azure OpenAI instead of Workers AI: set PROVIDER = "azure",
# AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_DEPLOYMENT here, then
#   wrangler secret put AZURE_OPENAI_API_KEY

# Optional: share the rate limit across isolates with a KV namespace.
#   wrangler kv namespace create RATE_LIMIT_KV
# then uncomment and paste the id:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<namespace id>"
