name = "portfolio-chat-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

# knowledge.md is imported by worker.js as a plain string
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# Your Azure OpenAI resource, e.g. https://my-resource.openai.azure.com
AZURE_OPENAI_ENDPOINT = "https://YOUR-RESOURCE.openai.azure.com"
AZURE_OPENAI_DEPLOYMENT = "gpt-4o"
AZURE_OPENAI_API_VERSION = "2024-10-21"
# Comma-separated list of origins allowed to call the worker
ALLOWED_ORIGIN = "https://sanketc001.github.io,http://localhost:5173"

# Secret (never commit it): wrangler secret put AZURE_OPENAI_API_KEY

# Optional: share the rate limit across isolates with a KV namespace.
#   wrangler kv namespace create RATE_LIMIT_KV
# then uncomment and paste the id:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<namespace id>"
